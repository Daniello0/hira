name: hira

services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      - -c
      - hnsw.iterative_scan=relaxed_order
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ['--model-id', 'BAAI/bge-m3']
    volumes:
      - tei-embed:/data
    restart: unless-stopped

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ['--model-id', 'BAAI/bge-reranker-v2-m3']
    volumes:
      - tei-rerank:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/core-api'
        APP_DIR: /app/apps/core-api
        START_COMMAND: node dist/migrate.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  core-api:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/core-api'
        APP_DIR: /app/apps/core-api
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RETRIEVAL_SERVICE_URL: http://retrieval-service:4001
      LLM_SERVICE_URL: http://llm-service:4002
      INGESTION_SERVICE_URL: http://ingestion-service:4003
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &node-health
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/retrieval-service'
        APP_DIR: /app/apps/retrieval-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEI_EMBED_URL: http://tei:80
      TEI_RERANK_URL: http://tei-rerank:80
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
      tei-rerank:
        condition: service_started
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  llm-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/llm-service'
        APP_DIR: /app/apps/llm-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      REDIS_URL: redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  ingestion-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/ingestion-service'
        APP_DIR: /app/apps/ingestion-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
    environment:
      PORT: 3000
      CORE_API_URL: http://core-api:4000
      NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

volumes:
  postgres-data:
  tei-embed:
  tei-rerank:

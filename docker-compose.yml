name: hira

services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      - -c
      - hnsw.iterative_scan=relaxed_order
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    # Model context is 8192. A smaller arena makes TEI truncate a long vacancy.
    # The reranker loads first: its startup peak plus a resident encoder does not fit in Docker.
    command: ['--model-id', 'BAAI/bge-m3', '--max-batch-tokens', '8192']
    volumes:
      - tei-embed:/data
    depends_on:
      tei-rerank:
        condition: service_healthy
    healthcheck: &tei-health
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ['--model-id', 'BAAI/bge-reranker-v2-m3', '--max-batch-tokens', '8192']
    volumes:
      - tei-rerank:/data
    healthcheck:
      <<: *tei-health
    restart: unless-stopped

  https:
    image: caddy:2.10-alpine
    profiles: ['lan']
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
    ports:
      - '3443:3443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - https-data:/data
    depends_on:
      - core-api
      - web
    restart: unless-stopped

  speech:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    environment:
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: 4
      STT_MODEL_TTL: -1
      TTS_MODEL_TTL: -1
      HF_HUB_DISABLE_XET: 1
      PRELOAD_MODELS: '["Systran/faster-whisper-base","speaches-ai/piper-ru_RU-irina-medium","speaches-ai/piper-en_US-amy-medium","speaches-ai/piper-es_MX-claude-high","speaches-ai/piper-de_DE-kerstin-low","speaches-ai/piper-fr_FR-siwis-medium"]'
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8000/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/core-api'
        APP_DIR: /app/apps/core-api
        START_COMMAND: node dist/migrate.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  core-api:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/core-api'
        APP_DIR: /app/apps/core-api
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      RETRIEVAL_SERVICE_URL: http://retrieval-service:4001
      LLM_SERVICE_URL: http://llm-service:4002
      INGESTION_SERVICE_URL: http://ingestion-service:4003
      TEI_EMBED_URL: http://tei:80
      LIBRARY_ROOT: /app/storage
      SPEECH_URL: http://speech:8000
    ports:
      - '4000:4000'
    volumes:
      - library-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &node-health
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/retrieval-service'
        APP_DIR: /app/apps/retrieval-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEI_EMBED_URL: http://tei:80
      TEI_RERANK_URL: http://tei-rerank:80
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      tei:
        condition: service_healthy
      tei-rerank:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  llm-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/llm-service'
        APP_DIR: /app/apps/llm-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      REDIS_URL: redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  ingestion-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        WORKSPACE: '@hira/ingestion-service'
        APP_DIR: /app/apps/ingestion-service
        START_COMMAND: node dist/main.js
    environment:
      PORT: 4003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      INGEST_LIMIT: ${INGEST_LIMIT:-2000}
      TEI_EMBED_URL: http://tei:80
      LLM_SERVICE_URL: http://llm-service:4002
      # ESCO CSVs from ESCO_HOST_DIR are mounted at /app/esco; with no CSVs the import is skipped.
      ESCO_DIR: ${ESCO_DIR:-/app/esco}
      SKILL_EXTRACTION_ENABLED: ${SKILL_EXTRACTION_ENABLED:-true}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-200}
      SOURCE_RABOTA_BY_ENABLED: ${SOURCE_RABOTA_BY_ENABLED:-true}
      SOURCE_GSZ_ENABLED: ${SOURCE_GSZ_ENABLED:-true}
      SOURCE_HABR_CAREER_ENABLED: ${SOURCE_HABR_CAREER_ENABLED:-true}
      SOURCE_PRACA_BY_ENABLED: ${SOURCE_PRACA_BY_ENABLED:-true}
      SOURCE_LINKEDIN_ENABLED: ${SOURCE_LINKEDIN_ENABLED:-false}
      SOURCE_INDEED_ENABLED: ${SOURCE_INDEED_ENABLED:-false}
      SOURCE_LINKEDIN_DAILY_CAP: ${SOURCE_LINKEDIN_DAILY_CAP:-150}
      SOURCE_INDEED_DAILY_CAP: ${SOURCE_INDEED_DAILY_CAP:-100}
    volumes:
      # A missing host folder is created empty by Docker; ESCO import then finds no CSVs and skips.
      - ${ESCO_HOST_DIR:-./data/esco}:/app/esco:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: skill extraction retries on its 15-minute tick. TEI is not awaited
      # (its first start takes ~10 minutes); embedding runs fail until it is up and then catch up.
      llm-service:
        condition: service_started
    healthcheck:
      <<: *node-health
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
    environment:
      PORT: 3000
      CORE_API_URL: http://core-api:4000
      NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      <<: *node-health
    restart: unless-stopped

volumes:
  postgres-data:
  tei-embed:
  tei-rerank:
  library-data:
  speech-models:
  https-data:
